# Runs the engine every morning and publishes the dashboard to GitHub Pages.
# 03:07 UTC = 07:07 Dubai. You can also run it any time from the Actions tab ("Run workflow").
name: Daily dashboard

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["manual_inputs/**", "finintel/**", "web/**", "reference/**"]

permissions:
  contents: write     # to save the point-in-time database back to the repo
  pages: write
  issues: write       # daily alerts are opened as GitHub issues (GitHub emails you)
  id-token: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Keep yesterday's results for alerts
        run: cp data/last_results.json /tmp/prev_results.json 2>/dev/null || true; cp data/global.json /tmp/prev_global.json 2>/dev/null || true
      - name: Run engine
        env:
          PYTHONUNBUFFERED: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; add it under Settings > Secrets > Actions
        run: |
          python -m finintel.run --site site --db data/finintel.sqlite
      - name: Save database history
        run: |
          git config user.name "finintel-bot"
          git config user.email "finintel-bot@users.noreply.github.com"
          git add data/finintel.sqlite data/last_results.json data/score_history.csv data/global.json
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          # if another run saved data meanwhile, keep this (newer) run's files on top of it
          git pull --rebase -q origin main || { git rebase --abort; git fetch -q origin main; git reset --soft origin/main;
            git add data/finintel.sqlite data/last_results.json data/score_history.csv data/global.json;
            git diff --cached --quiet || git commit -qm "Daily data $(date -u +%F)"; }
          git push
      - name: Alerts
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.notify /tmp/prev_results.json /tmp/prev_global.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
