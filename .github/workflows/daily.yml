# Runs the engine every morning and publishes the dashboard to GitHub Pages.
# 03:07 UTC = 07:07 Dubai. You can also run it any time from the Actions tab ("Run workflow").
name: Daily dashboard

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["manual_inputs/**", "finintel/**"]

permissions:
  contents: write     # to save the point-in-time database back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run engine
        run: |
          mkdir -p site
          python -m finintel.run --out site/index.html --db data/finintel.sqlite
      - name: Save database history
        run: |
          git config user.name "finintel-bot"
          git config user.email "finintel-bot@users.noreply.github.com"
          git add data/finintel.sqlite
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
